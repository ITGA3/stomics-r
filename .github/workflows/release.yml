name: Release

# Tags v<version> the first time a version reaches main, so users can pin it:
#   remotes::install_github("ITGA3/stomics-r@v0.1.0")
# Bump `Version:` in DESCRIPTION to cut a release.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the version if it is new
        run: |
          version="$(sed -n "s/^Version: *//p" DESCRIPTION)"
          if [ -z "$version" ]; then echo "No Version in DESCRIPTION" >&2; exit 1; fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already tagged."
          else
            git tag "v$version"
            git push origin "v$version"
          fi
